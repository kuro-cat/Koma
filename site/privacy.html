<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Koma privacy policy</title>
<link rel="icon" href="icon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  main { width: min(1000px, 100% - 40px); margin: 0 auto 72px; }
  main > * { max-width: 720px; }
  h1 { font-size: 32px; line-height: 1.1; letter-spacing: -0.02em; margin: 40px 0 12px; }
  h2 { font-size: 20px; margin: 36px 0 10px; padding-top: 14px; border-top: 2px solid var(--ink); }
  h3 { font-size: 16px; margin: 24px 0 6px; }
  hr { border: 0; border-top: 1px solid var(--rule-2); margin: 40px 0; }
  li { margin: 4px 0; }
  code { font-size: 0.92em; }
  p, li { color: var(--ink-2); }
  strong { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="mark" href="./"><img src="icon.jpg" alt=""><b>Koma</b></a>
    <nav><a href="https://github.com/kuro-cat/koma">GitHub</a></nav>
  </div>
</header>
<main id="policy"><p>Loading the privacy policy…</p></main>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
  // The policy lives once, in docs/privacy.md; the Pages workflow copies it here.
  fetch('privacy.md')
    .then((response) => {
      if (!response.ok) throw new Error(response.status);
      return response.text();
    })
    .then((text) => { document.getElementById('policy').innerHTML = marked.parse(text); })
    .catch(() => {
      document.getElementById('policy').innerHTML =
        '<p>The policy could not be loaded. Read it on <a href="https://github.com/kuro-cat/koma/blob/main/docs/privacy.md">GitHub</a>.</p>';
    });
</script>
<footer>
  <div class="wrap">
    <span>Koma · MIT License</span>
    <a href="./">Home</a>
    <a href="https://github.com/kuro-cat/koma/issues">Report an issue</a>
  </div>
</footer>
</body>
</html>
